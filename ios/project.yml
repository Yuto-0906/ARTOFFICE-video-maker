name: ARTOFFICE
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.4'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: '7'
    CODE_SIGN_STYLE: Automatic
packages:
  FFmpegKit:
    url: https://github.com/jaywcjlove/ffmpeg-kit.git
    revision: 0bd85df8f9693061f6f979414662baaf876a3e20
targets:
  ARTOFFICE:
    type: application
    platform: iOS
    sources: [App, Core, Media, Rendering, Resources]
    dependencies:
      - package: FFmpegKit
        product: ffmpegkit
    postBuildScripts:
      - name: Correct FFmpeg CoreMedia linkage
        script: bash "$SRCROOT/../scripts/ios/fix-coremedia-linkage.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ARTOFFICE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: 書き出した動画やサムネイルを「写真」に保存するために使用します。
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuto0906.artoffice-video-maker.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/NativeFFmpeg"
  ARTOFFICETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../tests/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ARTOFFICE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuto0906.artoffice-video-maker.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  ARTOFFICEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ARTOFFICE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuto0906.artoffice-video-maker.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ARTOFFICE
schemes:
  ARTOFFICE:
    build:
      targets:
        ARTOFFICE: all
    test:
      targets: [ARTOFFICETests, ARTOFFICEUITests]
      gatherCoverageData: true
