name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v6.1.0
        with:
          path: .tool-cache
          key: runtime-tools-${{ runner.os }}-${{ hashFiles('tools.lock.json') }}

      - name: Prepare build
        run: |
          npm ci
          python -m pip install fonttools==4.63.0

      - name: Fetch pinned runtime tools
        shell: powershell
        run: scripts/fetch-tools.ps1

      - name: Test
        run: |
          npm run build
          npm test -- --run
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml ffmpeg_output_resolution_contract_test -- --ignored --nocapture

      - name: Build and package
        shell: powershell
        run: scripts/package-portable.ps1 -SkipFetch

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
