name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag for the draft release
        type: string
        default: v0.4.0
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release version and signing configuration
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open("package.json"))["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit("The release tag must match package.json")
          names = ("APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "APPLE_SIGNING_IDENTITY",
                   "APPLE_ID", "APPLE_PASSWORD", "APPLE_TEAM_ID")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure GitHub Secrets first: " + ", ".join(missing))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
          PY
  macos:
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      sign: true
    secrets: inherit
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AOV_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache@v6.1.0
        with:
          path: .tool-cache
          key: runtime-tools-${{ runner.os }}-${{ hashFiles('tools.lock.json') }}
      - name: Prepare build
        run: |
          npm ci
          python -m pip install fonttools==4.63.0
      - name: Fetch pinned runtime tools
        shell: powershell
        run: scripts/fetch-tools.ps1
      - name: Test
        run: |
          npm run build
          npm test -- --run
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml ffmpeg_output_resolution_contract_test -- --ignored --nocapture
      - name: Build and package
        shell: powershell
        run: scripts/package-portable.ps1 -SkipFetch
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
  draft-release:
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check complete distribution set
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          version = json.load(open("package.json"))["version"]
          root = Path("artifacts")
          for suffix in ("windows-x64.zip", "macos-arm64.dmg", "macos-x64.dmg", "macos-sources.tar.gz"):
              path = root / f"ARTOFFICE-video-maker-v{version}-{suffix}"
              expected = Path(str(path) + ".sha256").read_text().split()[0]
              with path.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if expected != actual:
                  raise SystemExit(f"Checksum mismatch: {path.name}")
          for label in ("arm64", "x64"):
              report = json.loads((root / f"macos-{label}-verification.json").read_text())
              if report["status"] != "passed" or not report["signedAndNotarized"]:
                  raise SystemExit(f"Mac verification failed: {label}")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ARTOFFICE v0.4.0 macOS preview
          body_path: docs/RELEASE_NOTES_0.4.0.md
          draft: true
          prerelease: true
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*verification.json
