name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: .tool-cache
          key: runtime-tools-${{ runner.os }}-${{ hashFiles('tools.lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install fonttools==4.63.0

      - name: Fetch pinned runtime tools
        shell: powershell
        run: scripts/fetch-tools.ps1

      - name: Frontend checks
        run: |
          npm run build
          npm test -- --run

      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Full-resolution render contract
        run: cargo test --manifest-path src-tauri/Cargo.toml ffmpeg_output_resolution_contract_test -- --ignored --nocapture

      - name: Build application
        run: npm run tauri -- build --no-bundle

      - name: Package portable ZIP
        shell: powershell
        run: scripts/package-portable.ps1 -SkipBuild -SkipFetch

      - uses: actions/upload-artifact@v4
        with:
          name: ARTOFFICE-video-maker-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
