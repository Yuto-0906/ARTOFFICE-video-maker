[package]
name = "artoffice-video-maker"
version = "0.2.1"
description = "ARTOFFICE広報動画作成ソフト"
authors = ["Yuto-0906"]
edition = "2021"

[lib]
name = "artoffice_video_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "6"
exif = { package = "kamadak-exif", version = "0.6" }
fontdue = "0.9"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
